name: CI / CD - Test & Deploy to Toolforge

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build

  deploy:
    name: Deploy to Toolforge
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via Native SSH to Toolforge
        env:
          SSH_USER: ${{ secrets.TOOLFORGE_SSH_USER }}
          SSH_KEY: ${{ secrets.TOOLFORGE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H login.toolforge.org >> ~/.ssh/known_hosts
          
          eval $(ssh-agent -s)
          echo "$SSH_KEY" | tr -d '\r' | ssh-add -
          
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new "${SSH_USER}@login.toolforge.org" << 'EOF'
            set -e
            echo "Starting build on Toolforge..."
            become source-translation toolforge build start https://github.com/gyan111/source-translation
            
            echo "Waiting for build to finish building container..."
            sleep 10
            while become source-translation toolforge build show 2>&1 | grep -iq "running\|pending\|scheduled"; do
              echo "Build in progress... waiting 10s"
              sleep 10
            done
            
            echo "Build Status:"
            become source-translation toolforge build show
            
            echo "Stopping webservice to force pulling new container image..."
            become source-translation toolforge webservice stop || true
            sleep 5
            
            echo "Starting webservice with newly built container image..."
            become source-translation toolforge webservice --mount=none buildservice start || become source-translation toolforge webservice buildservice start
            echo "Source Translation deployment complete!"
          EOF
