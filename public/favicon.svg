<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Background Rounded Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#primaryGrad)" filter="url(#shadow)" />

  <!-- Inner subtle border -->
  <rect x="3" y="3" width="58" height="58" rx="15" stroke="white" stroke-opacity="0.2" stroke-width="1.5" fill="none" />

  <!-- Translation Character / Symbol '文' Left Top -->
  <g fill="white" opacity="0.95" transform="translate(13, 14) scale(0.65)">
    <!-- Top dot & horizontal bar -->
    <circle cx="20" cy="5" r="3.5" />
    <path d="M 5 15 L 35 15" stroke="white" stroke-width="4.5" stroke-linecap="round" />
    <!-- Crossing strokes -->
    <path d="M 27 18 L 8 40" stroke="white" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 13 23 Q 22 32 34 40" stroke="white" stroke-width="4.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Exchange / Translation Arrow Arc -->
  <path d="M 36 24 C 44 26 48 33 46 41" stroke="#93c5fd" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 3" fill="none" />
  
  <!-- Target Language 'W' Character with Green Accent Badge -->
  <circle cx="44" cy="42" r="14" fill="url(#accentGrad)" filter="url(#shadow)" />
  <circle cx="44" cy="42" r="13" stroke="white" stroke-opacity="0.3" stroke-width="1" fill="none" />
  
  <!-- 'W' (Wikipedia / Wiki) inside badge -->
  <path d="M 37 36 L 40 48 L 44 38.5 L 48 48 L 51 36" stroke="white" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>
