<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Filters for Glow & Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.15" />
    </filter>
    <filter id="logoGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Background Decorative Glowing Orbs -->
  <circle cx="200" cy="150" r="280" fill="#2563eb" opacity="0.18" filter="url(#logoGlow)" />
  <circle cx="1020" cy="480" r="260" fill="#0284c7" opacity="0.15" filter="url(#logoGlow)" />
  <circle cx="600" cy="580" r="200" fill="#4f46e5" opacity="0.12" filter="url(#logoGlow)" />

  <!-- Grid overlay for technical feel -->
  <g stroke="#334155" stroke-width="1" opacity="0.15">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="150" y1="0" x2="150" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="450" y1="0" x2="450" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="750" y1="0" x2="750" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1050" y1="0" x2="1050" y2="630" />
  </g>

  <!-- Main Glassmorphic Container Card -->
  <rect x="60" y="50" width="1080" height="530" rx="28" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5" filter="url(#cardShadow)" />

  <!-- Inner Top Highlight Line -->
  <path d="M 90 51 L 1110 51" stroke="url(#cyanGlow)" stroke-width="2" stroke-linecap="round" />

  <!-- LEFT COLUMN: Branding & Typography -->
  <g transform="translate(120, 115)">
    <!-- Category Pill Badge -->
    <rect x="0" y="0" width="280" height="38" rx="19" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="20" cy="19" r="6" fill="#38bdf8" />
    <text x="36" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" letter-spacing="1.5">WIKIMEDIA TOOLFORGE</text>

    <!-- Main Heading -->
    <text x="0" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Source Translation Tool</text>
    
    <!-- Subtitle / Tagline -->
    <text x="0" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="600" fill="#93c5fd">Wikipedia Translation Workbench</text>

    <!-- Description Lines -->
    <text x="0" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400" fill="#94a3b8" width="540">
      <tspan x="0" dy="0">Translate Wikipedia articles, infoboxes &amp; templates across</tspan>
      <tspan x="0" dy="26">languages with automated Wikidata entity resolution and</tspan>
      <tspan x="0" dy="26">complete MediaWiki syntax preservation.</tspan>
    </text>

    <!-- Interactive Badges Row -->
    <g transform="translate(0, 290)">
      <!-- Badge 1: Wikidata -->
      <rect x="0" y="0" width="165" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="18" y="26" font-family="sans-serif" font-size="14" font-weight="600" fill="#f8fafc">⚡ Wikidata Links</text>

      <!-- Badge 2: Templates -->
      <rect x="180" y="0" width="180" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="198" y="26" font-family="sans-serif" font-size="14" font-weight="600" fill="#f8fafc">🧩 Infobox Preserved</text>

      <!-- Badge 3: Multi-engine -->
      <rect x="375" y="0" width="170" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="393" y="26" font-family="sans-serif" font-size="14" font-weight="600" fill="#f8fafc">🌐 10+ AI Engines</text>
    </g>
  </g>

  <!-- RIGHT COLUMN: Visual Hero Artwork (Glowing Wikipedia W + Translation Shield) -->
  <g transform="translate(830, 280)">
    <!-- Outer Aura Rings -->
    <circle cx="100" cy="30" r="140" fill="none" stroke="#2563eb" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="6 8" />
    <circle cx="100" cy="30" r="115" fill="none" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
    
    <!-- Glow Center -->
    <circle cx="100" cy="30" r="90" fill="url(#blueGlow)" opacity="0.9" filter="url(#cardShadow)" />
    
    <!-- Wikipedia 'W' Icon -->
    <g transform="translate(48, -25) scale(1.65)" fill="white">
      <path d="M 12 10 L 22 52 L 34 22 L 46 52 L 56 10 L 48 10 L 42 40 L 32 10 L 26 10 L 16 40 L 10 10 Z" fill="#ffffff" filter="url(#cardShadow)" />
    </g>

    <!-- Orbiting Translation Bubble 1: '文' -->
    <g transform="translate(-10, -50)">
      <circle cx="28" cy="28" r="28" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#cardShadow)" />
      <text x="18" y="37" font-family="-apple-system, sans-serif" font-size="22" font-weight="bold" fill="#38bdf8">文</text>
    </g>

    <!-- Orbiting Translation Bubble 2: 'A' -->
    <g transform="translate(160, -35)">
      <circle cx="26" cy="26" r="26" fill="#1e293b" stroke="#22d3ee" stroke-width="2" filter="url(#cardShadow)" />
      <text x="17" y="35" font-family="-apple-system, sans-serif" font-size="22" font-weight="bold" fill="#22d3ee">A</text>
    </g>

    <!-- Orbiting Translation Bubble 3: 'ଅ' (Odia / Indic) -->
    <g transform="translate(145, 85)">
      <circle cx="26" cy="26" r="26" fill="#1e293b" stroke="#34d399" stroke-width="2" filter="url(#cardShadow)" />
      <text x="15" y="35" font-family="'Noto Sans Oriya', sans-serif" font-size="20" font-weight="bold" fill="#34d399">ଅ</text>
    </g>

    <!-- Orbiting Translation Bubble 4: 'ض' (Arabic) -->
    <g transform="translate(-5, 95)">
      <circle cx="24" cy="24" r="24" fill="#1e293b" stroke="#f59e0b" stroke-width="2" filter="url(#cardShadow)" />
      <text x="15" y="32" font-family="sans-serif" font-size="20" font-weight="bold" fill="#f59e0b">ض</text>
    </g>
  </g>

  <!-- Bottom Brand Footer inside card -->
  <text x="120" y="530" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500" fill="#64748b">
    https://source-translation.toolforge.org • Free &amp; Open Source Software
  </text>
</svg>
